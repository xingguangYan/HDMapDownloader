[package]
name = "hdmapdl"
version = "4.0.0"
authors = ["xingguangYan"]
edition = "2021"
license = "MIT"
description = "HD Map Downloader v3.0 - 多源高清地图瓦片下载器"
repository = ""

[dependencies]
# UI
eframe = { version = "0.31", default-features = true, features = ["glow"] }
egui = "0.31"

# HTTP
ureq = { version = "2.10", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Image processing
image = "0.25"

# Compression for export
zip = "1.2"

# Threading
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = false
debug = false

[[bin]]
name = "hdmapdl"
path = "src/main.rs"
