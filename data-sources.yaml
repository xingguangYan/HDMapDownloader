# HD Map Downloader v4.0 - 数据源清单
# 标注: free=免Key; key=需注册申请 Key/License; time=时间序列(按日期)

base_maps:
  - {id: esri, name: "Esri 世界影像", free: yes, license: "Esri 服务条款", url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"}
  - {id: google_sat, name: "谷歌卫星影像", free: yes, license: "Google 条款(学习测试)", url: "https://mt0.google.cn/vt/lyrs=s&gl=cn&x={x}&y={y}&z={z}"}
  - {id: amap_sat, name: "高德卫星影像", free: yes, license: "高德服务条款", url: "https://webst01.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}"}
  - {id: osm, name: "OpenStreetMap", free: yes, license: "ODbL 1.0", url: "https://tile.openstreetmap.de/{z}/{x}/{y}.png"}
  - {id: carto, name: "CartoDB 浅/深矢量", free: yes, license: "CC-BY 4.0"}
  - {id: topo, name: "OpenTopoMap", free: yes, license: "CC-BY-SA 3.0"}

satellite_imagery:
  - {id: eoxs2, name: "Sentinel-2 无云镶嵌 2020", free: yes, license: "EOX CC-BY-NC 4.0"}
  - {id: nasa_bmng, name: "NASA Blue Marble NG", free: yes, license: "NASA 公有领域"}

time_series_gibs_wms:
  - {id: modis, name: "MODIS Terra 真彩色", free: yes, time: day}
  - {id: aqua, name: "MODIS Aqua 真彩色", free: yes, time: day}
  - {id: viirs, name: "VIIRS SNPP 真彩色", free: yes, time: day}
  - {id: hls_l, name: "Landsat 8/9 (HLS L30)", free: yes, time: day}
  - {id: hls_s, name: "Sentinel-2 (HLS S30)", free: yes, time: day}

key_sources:
  - {id: tianditu, name: "天地图影像 img_w", key: tk, howto: "lbs.tianditu.gov.cn 注册申请"}
  - {id: tianditu_vec, name: "天地图矢量 vec_w", key: tk}
  - {id: planet, name: "Planet NICFI 月度镶嵌", key: api_key}

custom_sources:
  note: "登录中科星图/长光等平台后, 粘贴含 {z}/{x}/{y} 的瓦片 URL 模板({key} 占位)接入"

stac_imagery_search:
  endpoint: "https://earth-search.aws.element84.com/v1/search"
  collections:
    - sentinel-2-l2a       # 波段 COG 直连下载
    - landsat-c2-l2         # S3 requester-pays, 给路径
    - sentinel-1-grd
    - cop-dem-glo-90

admin_vectors:
  endpoint: "https://geo.datav.aliyun.com/areas_v3/bound/{adcode}_full.json"
  levels: [国家, 省/直辖市, 市/州, 县/区]

portals_raw_data:
  - {name: "中科星图 星图地球", url: "https://daily.geovisearth.com/"}
  - {name: "长光卫星 吉林一号", url: "https://www.jl1.cn/"}
  - {name: "中国资源卫星应用中心", url: "https://data.cresda.cn/"}
  - {name: "地理空间数据云", url: "https://www.gscloud.cn/"}
  - {name: "Copernicus 数据空间", url: "https://dataspace.copernicus.eu/"}
  - {name: "USGS EarthExplorer", url: "https://earthexplorer.usgs.gov/"}