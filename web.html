<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD高清地图下载器 v2.0</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; background:#0f1419; color:#e6e6e6; }
#app { display:flex; height:100vh; }
#sidebar { width:320px; background:#1a2129; padding:18px; overflow-y:auto; border-right:1px solid #2a3441; flex-shrink:0; }
#sidebar h1 { font-size:20px; margin-bottom:4px; color:#4fc3f7; }
#sidebar .sub { font-size:12px; color:#8899a6; margin-bottom:16px; }
#main { flex:1; display:flex; flex-direction:column; }
#map { flex:1; background:#1a2129; }
.panel { background:#212a35; border:1px solid #2a3441; border-radius:10px; padding:14px; margin-bottom:14px; }
.panel h3 { font-size:13px; color:#4fc3f7; margin-bottom:10px; text-transform:uppercase; letter-spacing:1px; }
.panel select, .panel input { width:100%; padding:8px 10px; background:#0f1419; color:#e6e6e6; border:1px solid #2a3441; border-radius:6px; font-size:13px; margin-bottom:8px; }
.panel label { font-size:12px; color:#8899a6; display:block; margin:8px 0 4px; }
.btn { width:100%; padding:10px; background:#4fc3f7; color:#0f1419; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px; margin-top:6px; }
.btn:hover { background:#29b6f6; }
.btn:disabled { background:#37474f; color:#78909c; cursor:not-allowed; }
.btn-stop { background:#ef5350; color:#fff; }
.btn-stop:hover { background:#e53935; }
#status { font-size:12px; color:#8899a6; margin-top:8px; line-height:1.6; }
#progress-wrap { background:#0f1419; border-radius:6px; height:14px; margin-top:8px; overflow:hidden; display:none; }
#progress-bar { background:linear-gradient(90deg,#4fc3f7,#26c6da); height:100%; width:0%; transition:width .2s; }
#qr-panel { text-align:center; }
#qr-img { width:200px; height:200px; border-radius:10px; margin:8px auto; display:block; background:#fff; padding:8px; }
#qr-panel p { font-size:12px; color:#8899a6; margin-top:6px; }
.tip { font-size:11px; color:#546e7a; margin-top:6px; line-height:1.5; }
.leaflet-container { background:#1a2129; }
#coords { position:absolute; bottom:10px; left:10px; background:rgba(15,20,25,.85); padding:6px 12px; border-radius:6px; font-size:12px; z-index:999; pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>HD 高清地图下载器</h1>
    <div class="sub">v2.0 · 多源免费瓦片 · 浏览器直接下载</div>

    <div class="panel">
      <h3>地图源</h3>
      <select id="source"></select>
      <div class="tip" id="src-tip"></div>
    </div>

    <div class="panel">
      <h3>下载范围（在地图上拖框选择）</h3>
      <div id="bounds" class="tip">尚未选择区域</div>
      <button class="btn" id="btn-clear">清除选区</button>
    </div>

    <div class="panel">
      <h3>下载级别</h3>
      <label>最小级别 <span id="zmin-v"></span></label>
      <input type="range" id="zmin" min="0" max="20" value="12">
      <label>最大级别 <span id="zmax-v"></span></label>
      <input type="range" id="zmax" min="0" max="20" value="15">
      <div class="tip" id="tile-count"></div>
    </div>

    <div class="panel">
      <h3>下载</h3>
      <button class="btn" id="btn-dl">开始下载为 ZIP</button>
      <button class="btn btn-stop" id="btn-stop" style="display:none">停止</button>
      <div id="progress-wrap"><div id="progress-bar"></div></div>
      <div id="status">就绪。在地图上拖出一个矩形框即可开始。</div>
    </div>

<script>
var SOURCES = [
  {id:"esri", name:"Esri World Imagery（全球高清卫星）", url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", max:19, tip:"全球高清影像，免授权可直接浏览使用"},
  {id:"osm", name:"OpenStreetMap（矢量地图）", url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", max:19, tip:"开源矢量地图，ODbL 数据许可"},
  {id:"nasa", name:"NASA Blue Marble（全球卫星底图）", url:"https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/500m/{z}/{y}/{x}.jpeg", max:8, tip:"NASA 公有领域数据，分辨率较低"},
  {id:"usgs", name:"USGS National Map（美国影像）", url:"https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}", max:16, tip:"美国公有领域影像，仅覆盖美国"},
  {id:"carto", name:"CartoDB 浅色矢量", url:"https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png", max:18, tip:"CC-BY 4.0 浅色矢量底图"},
  {id:"cartodark", name:"CartoDB 深色矢量", url:"https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png", max:18, tip:"CC-BY 4.0 深色矢量底图"},
  {id:"tianditu", name:"天地图影像（需自行填 tk）", url:"https://t0.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=YOUR_KEY", max:18, tip:"免费但需在 lbs.tianditu.gov.cn 申请 Key"}
];

var map = L.map("map", {center:[35, 110], zoom:4, zoomControl:true, worldCopyJump:true});
var curLayer = null;
var rect = null, startPt = null, doing = false;
var selected = null;
var zip = null, jobs = [], doneN = 0, skipN = 0, failN = 0, stopped = false;

function loadSource(i){
  var s = SOURCES[i];
  if (curLayer) map.removeLayer(curLayer);
  curLayer = L.tileLayer(s.url, {maxZoom:s.max, attribution:"HDMapDownloader", crossOrigin:true});
  curLayer.addTo(map);
  document.getElementById("src-tip").textContent = s.tip;
}

var sel = document.getElementById("source");
SOURCES.forEach(function(s,i){ var o=document.createElement("option"); o.value=i; o.textContent=s.name; sel.appendChild(o); });
sel.onchange = function(){ loadSource(parseInt(sel.value)); };
loadSource(0);

map.on("mousemove", function(e){ document.getElementById("coords").textContent = e.latlng.lng.toFixed(5)+", "+e.latlng.lat.toFixed(5); });

map.on("mousedown", function(e){ startPt = e.latlng; doing = true; });
map.on("mouseup", function(e){
  if(!doing) return; doing = false;
  var a = startPt, b = e.latlng;
  var south = Math.min(a.lat,b.lat), north = Math.max(a.lat,b.lat);
  var west = Math.min(a.lng,b.lng), east = Math.max(a.lng,b.lng);
  if(rect) map.removeLayer(rect);
  rect = L.rectangle([[south,west],[north,east]], {color:"#4fc3f7", weight:2, fillColor:"#4fc3f7", fillOpacity:.15}).addTo(map);
  selected = {s:south, w:west, n:north, e:east};
  document.getElementById("bounds").textContent =
    "纬度 "+south.toFixed(4)+" ~ "+north.toFixed(4)+"\n经度 "+west.toFixed(4)+" ~ "+east.toFixed(4);
  updateCount();
});

document.getElementById("btn-clear").onclick = function(){
  if(rect) map.removeLayer(rect); rect=null; selected=null;
  document.getElementById("bounds").textContent = "尚未选择区域";
  document.getElementById("tile-count").textContent = "";
};

function tilesInBounds(z){
  if(!selected) return [];
  var n = Math.pow(2,z);
  var x0 = Math.floor((selected.w+180)/360*n), x1 = Math.floor((selected.e+180)/360*n);
  var y0 = Math.floor((1-Math.log(Math.tan(selected.n*Math.PI/180)+1/Math.cos(selected.n*Math.PI/180))/Math.PI)/2*n);
  var y1 = Math.floor((1-Math.log(Math.tan(selected.s*Math.PI/180)+1/Math.cos(selected.s*Math.PI/180))/Math.PI)/2*n);
  var out=[];
  for(var x=Math.min(x0,x1); x<=Math.max(x0,x1); x++) for(var y=Math.min(y0,y1); y<=Math.max(y0,y1); y++) out.push([z,x,y]);
  return out;
}

function updateCount(){
  if(!selected) return;
  var zmin = parseInt(document.getElementById("zmin").value);
  var zmax = Math.min(parseInt(document.getElementById("zmax").value), SOURCES[parseInt(sel.value)].max);
  var total = 0;
  for(var z=zmin; z<=zmax; z++) total += tilesInBounds(z).length;
  document.getElementById("tile-count").textContent = "预计 "+total.toLocaleString()+" 块瓦片（约 "+(total*15/1024).toFixed(1)+" MB）";
}

document.getElementById("zmin").oninput = function(){ document.getElementById("zmin-v").textContent = this.value; updateCount(); };
document.getElementById("zmax").oninput = function(){ document.getElementById("zmax-v").textContent = this.value; updateCount(); };
document.getElementById("zmin-v").textContent = 12;
document.getElementById("zmax-v").textContent = 15;

function setStatus(t){ document.getElementById("status").textContent = t; }

async function fetchTile(url){
  try{
    var r = await fetch(url);
    if(!r.ok) return null;
    var b = await r.blob();
    if(b.size < 100) return null;
    return b;
  }catch(e){ return null; }
}

document.getElementById("btn-dl").onclick = async function(){
  if(!selected){ setStatus("请先在地图上拖框选择区域"); return; }
  var btn = this; btn.disabled = true;
  document.getElementById("btn-stop").style.display = "block";
  document.getElementById("progress-wrap").style.display = "block";
  stopped = false; doneN = 0; skipN = 0; failN = 0;
  zip = new JSZip();

  var si = parseInt(sel.value);
  var src = SOURCES[si];
  var zmin = parseInt(document.getElementById("zmin").value);
  var zmax = Math.min(parseInt(document.getElementById("zmax").value), src.max);
  if(zmax < zmin){ setStatus("最大级别不能小于最小级别"); btn.disabled=false; document.getElementById("btn-stop").style.display="none"; return; }

  var all = [];
  for(var z=zmin; z<=zmax; z++){
    var tiles = tilesInBounds(z);
    tiles.forEach(function(t){ all.push({z:t[0], x:t[1], y:t[2]}); });
  }
  if(all.length > 20000){ setStatus("范围过大（"+all.length+" 块），请缩小区域或降低级别"); btn.disabled=false; document.getElementById("btn-stop").style.display="none"; return; }
  if(all.length === 0){ setStatus("没有可下载的瓦片"); btn.disabled=false; document.getElementById("btn-stop").style.display="none"; return; }

  setStatus("开始下载 "+all.length+" 块瓦片…");
  var total = all.length;
  var CONC = 8;
  var idx = 0;

  async function worker(){
    while(idx < all.length && !stopped){
      var j = all[idx++];
      var url = src.url.replace("{z}",j.z).replace("{x}",j.x).replace("{y}",j.y);
      var b = await fetchTile(url);
      if(b){ zip.file(j.z+"/"+j.x+"/"+j.y+".png", b); doneN++; }
      else failN++;
      var p = Math.round((doneN+failN)/total*100);
      document.getElementById("progress-bar").style.width = p+"%";
      setStatus("进度 "+(doneN+failN)+"/"+total+"（成功 "+doneN+"，失败 "+failN+"）");
    }
  }
  var ws = [];
  for(var w=0; w<CONC; w++) ws.push(worker());
  await Promise.all(ws);

  if(stopped){ setStatus("已停止。成功 "+doneN+"，失败 "+failN); btn.disabled=false; document.getElementById("btn-stop").style.display="none"; return; }

  setStatus("正在打包 ZIP…");
  zip.file("README.txt", "HD Map Downloader v2.0\n数据源: "+src.name+"\n级别: "+zmin+"-"+zmax+"\n下载时间: "+new Date().toISOString()+"\n\n请遵守数据源许可条款。");
  var blob = await zip.generateAsync({type:"blob"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "HDMapDownloader_"+src.id+"_z"+zmin+"-"+zmax+".zip";
  a.click();
  setStatus("完成！成功 "+doneN+"，失败 "+failN+"，ZIP 已保存到浏览器下载目录");
  btn.disabled = false;
  document.getElementById("btn-stop").style.display = "none";
};

document.getElementById("btn-stop").onclick = function(){
  stopped = true;
  setStatus("正在停止…");
};
</script>
